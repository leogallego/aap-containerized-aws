---
argument_specs:
  main:
    short_description: >-
      Provision Let's Encrypt SSL certificates using certbot or community.crypto
    description:
      - >-
        Obtains SSL/TLS certificates from Let's Encrypt using the specified
        provider. Supports DNS-01 (Route53) and HTTP-01 challenge methods.
        Optionally deploys certificates to running AAP services.
    options:
      letsencrypt_provider:
        type: str
        default: acme
        description: >-
          Certificate provisioning provider. Built-in: 'acme', 'certbot'.
          Extensible by adding tasks/provider_<name>.yml.

      letsencrypt_email:
        type: str
        required: true
        description: Email address for Let's Encrypt account notifications.

      letsencrypt_domain:
        type: str
        required: true
        description: Domain name for the certificate.

      letsencrypt_route53_zone_id:
        type: str
        default: ""
        description: >-
          Route53 hosted zone ID for DNS-01 challenge.
          If empty, HTTP-01 challenge is used.

      letsencrypt_use_production:
        type: bool
        default: false
        description: >-
          Use Let's Encrypt production directory. Default is false (staging).
          Staging certificates are valid but not trusted by browsers.
          Production has strict rate limits (50 certs/domain/week).

      letsencrypt_acme_directory:
        type: str
        default: https://acme-staging-v02.api.letsencrypt.org/directory
        description: >-
          ACME directory URL. Derived from letsencrypt_use_production by default.
          Override to use a custom ACME-compatible CA.

      letsencrypt_key_type:
        type: str
        default: rsa
        choices:
          - rsa
          - ecc
        description: >-
          Certificate key type. RSA is the default and widely tested with AAP.
          ECC (ECDSA) keys are faster and smaller but less tested with AAP.

      letsencrypt_key_size:
        type: int
        default: 2048
        description: RSA key size in bits. Only used when letsencrypt_key_type is 'rsa'.

      letsencrypt_key_curve:
        type: str
        default: secp256r1
        choices:
          - secp256r1
          - secp384r1
        description: >-
          ECC curve name. Only used when letsencrypt_key_type is 'ecc'.
          secp521r1 is not supported by Let's Encrypt.

      letsencrypt_remaining_days:
        type: int
        default: 30
        description: Renew certificate when fewer than this many days remain.

      letsencrypt_cert_dir:
        type: str
        default: /etc/letsencrypt/live
        description: >-
          Base directory for certificate storage.

      letsencrypt_acme_key_dir:
        type: str
        default: /etc/letsencrypt/acme
        description: >-
          Directory for ACME account key and CSR files.

      letsencrypt_deploy_to_aap:
        type: bool
        default: false
        description: >-
          Deploy certificates to AAP service directories and restart services.
          Set to true for standalone use on running AAP instances.

      letsencrypt_aap_user:
        type: str
        default: ec2-user
        description: AAP service user for certificate file ownership and restarts.

      letsencrypt_include_mcp:
        type: bool
        default: false
        description: Whether to deploy certificates to the MCP server.
